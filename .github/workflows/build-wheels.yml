name: Build minilzo Wheels

on:
  push:
    tags: ['v*']  # 推送 v 开头的 tag 时触发，也可改为 workflow_dispatch 手动触发
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]  # 你只需要 Windows 的 wheel，可扩展到其他平台

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.0   # 直接使用当前最新版本
        env:
          CIBW_BUILD: "cp314-*"          # 锁定 Python 3.14
          CIBW_ARCHS_WINDOWS: "AMD64"    # 只要 64 位

      - uses: actions/upload-artifact@v4
        with:
          name: minilzo-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
